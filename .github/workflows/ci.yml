name: "Solidity"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: "Install Foundry stable"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: stable

      - name: "Install Solhint"
        run: "npm i -g solhint@6.0"

      - name: "Print Solhint version"
        run: "solhint --version"

      - name: "Lint the code"
        run: "make lint"

      - name: "Add lint summary"
        run: |
          echo "## Lint result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: "Install Foundry stable"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: stable

      - name: "Check contract sizes"
        run: |
          MAX_SIZE=24576
          WARN20=$((MAX_SIZE * 80 / 100))
          WARN10=$((MAX_SIZE * 90 / 100))
          WARN5=$((MAX_SIZE * 95 / 100))

          echo "## Full forge build --sizes output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          forge build --sizes | tee -a $GITHUB_STEP_SUMMARY | \
          awk -F'|' -v max=$MAX_SIZE -v w20=$WARN20 -v w10=$WARN10 -v w5=$WARN5 '
            NR>4 && NF>4 {
              # column 2 = contract, column 3 = runtime size
              gsub(/ /,"",$2); gsub(/ /,"",$3); gsub(/,/,"",$3);
              contract=$2; size=$3+0;
              if (contract != "") {
                if (size >= max) {
                  print "::error::" contract " exceeds the EVM max size (" size " / " max ")"
                  exitcode=1
                } else if (size >= w5) {
                  print "::warning::" contract " is above 95% of max size (" size " / " max ")"
                } else if (size >= w10) {
                  print "::warning::" contract " is above 90% of max size (" size " / " max ")"
                } else if (size >= w20) {
                  print "::warning::" contract " is above 80% of max size (" size " / " max ")"
                }
              }
            }
            END { exit exitcode }
          '

      - name: "Add build summary"
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  slither:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "stable"

      - name: "Build contracts in src/ folder"
        run: forge build --build-info --skip test script

      - name: "Run slither analyzer"
        uses: crytic/slither-action@v0.4.0
        with:
          ignore-compile: false
          slither-version: "0.11.0"
          fail-on: "low"

      - name: "Add slither summary"
        run: |
          echo "## Slither result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: "ubuntu-latest"
    env:
      LINEA_RPC_URL: ${{ secrets.LINEA_RPC_URL }}
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v4"
        with:
          submodules: recursive

      - name: "Install Foundry stable"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: "stable"

      - name: "Show the Foundry config"
        run: "forge --version && echo '\n' && forge config"

      - name: "Generate a fuzz seed that changes weekly to avoid burning through RPC allowance"
        run: >
          echo "FOUNDRY_FUZZ_SEED=$(
            echo $(($EPOCHSECONDS - $EPOCHSECONDS % 604800))
          )" >> $GITHUB_ENV

      - name: "Run the tests"
        run: "FOUNDRY_PROFILE=ci forge test --force --isolate -vvv --show-progress"

      # TODO: Uncomment once we have a coverage threshold
      - name: "Check test coverage"
        env:
          COVERAGE_MIN: 100
        run: |
          forge coverage --no-match-coverage "(test|mocks|dependencies|script|Bytes32AddressLib.sol|BytesLib.sol|CREATE3.sol|RewardDistributor.sol|Migrator.sol)" --force --report summary | tee coverage.txt
          coverage=$(grep "| Total" coverage.txt | awk '{print $4}' | sed 's/%//')
          if [ -z "$coverage" ]; then
            echo "❌ Failed to extract coverage percentage."
            exit 1
          fi
          if (( $(echo "$coverage < $COVERAGE_MIN" | bc -l) )); then
            echo "❌ Current coverage of $coverage% is below the minimum of $COVERAGE_MIN%."
            exit 1
          else
            echo "✅ Current coverage of $coverage% meets the minimum of $COVERAGE_MIN%."
          fi
          rm coverage.txt

      - name: "Add test summary"
        run: |
          echo "## Tests result" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed" >> $GITHUB_STEP_SUMMARY
