name: Run Foundry Forge Tests

env:
  LINEA_RPC_URL: ${{ secrets.LINEA_RPC_URL }}
  
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Solidity tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: 'latest' 

      - name: Install Dependencies
        run: yarn install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry dependencies
        run: forge install

      - name: Check contract sizes
        run: |
          MAX_SIZE=24576
          WARN20=$((MAX_SIZE * 80 / 100))
          WARN10=$((MAX_SIZE * 90 / 100))
          WARN5=$((MAX_SIZE * 95 / 100))

          echo "## Contract size report" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | Size (bytes) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY

          STATUS=0
          forge build --sizes | grep -E "bytes" | awk '{print $1, $3}' | while read CONTRACT SIZE; do
            STATUS_MSG="✅ OK"

            if [ "$SIZE" -ge "$MAX_SIZE" ]; then
              echo "::error::$CONTRACT exceeds the EVM max size ($SIZE / $MAX_SIZE)"
              STATUS_MSG="❌ EXCEEDS LIMIT"
              STATUS=1
            elif [ "$SIZE" -ge "$WARN5" ]; then
              echo "::warning::$CONTRACT is above 95% of max size ($SIZE / $MAX_SIZE)"
              STATUS_MSG="⚠️ >95%"
            elif [ "$SIZE" -ge "$WARN10" ]; then
              echo "::warning::$CONTRACT is above 90% of max size ($SIZE / $MAX_SIZE)"
              STATUS_MSG="⚠️ >90%"
            elif [ "$SIZE" -ge "$WARN20" ]; then
              echo "::warning::$CONTRACT is above 80% of max size ($SIZE / $MAX_SIZE)"
              STATUS_MSG="⚠️ >80%"
            fi

            echo "| $CONTRACT | $SIZE | $STATUS_MSG |" >> $GITHUB_STEP_SUMMARY
          done

          exit $STATUS

      - name: Run Solidity tests
        run: forge test 
        id: test
